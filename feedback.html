<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご意見・不具合の報告</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23eef1f5'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23fff' stroke='%230d1420' stroke-width='2'/%3E%3Cpath d='M16 8.5V16l5.4 3.4' fill='none' stroke='%230d1420' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23c2410c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 方向D「白の計器」。トップページと同じ決まりを、下層にも通す。 */
:root {
  color-scheme: light;
  --paper:#eef1f5; --surface:#ffffff; --ink:#0d1420; --ink-2:#3d4a63; --ink-3:#56637c;
  --rule:#ccd4e0; --grid:#dbe2ec; --amber:#f0a63c; --amber-ink:#8a5a12; --signal:#c2410c; --warn:#a33a2a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); line-height: 1.9;
  font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--amber-ink); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 1.4rem; }

.nav { position: sticky; top: 0; z-index: 40; background: rgba(238,241,245,.92); backdrop-filter: blur(10px); border-bottom: 1.5px solid var(--ink); }
.nav-in { display: flex; align-items: center; justify-content: space-between; padding: .7rem 0; gap: 1rem; }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand .name { font-size: .95rem; letter-spacing: .04em; font-weight: 700; }
.nav-cta { background: var(--ink); color: #f7f9fc; text-decoration: none; font-weight: 700; padding: .5rem 1.15rem; font-size: .86rem; border-radius: 2px; white-space: nowrap; }

.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .24em; color: var(--amber-ink); border-top: 2px solid var(--ink); padding-top: .5rem; display: inline-block; }
h1 { font-size: clamp(1.5rem,4vw,2rem); font-weight: 900; line-height: 1.42; letter-spacing: -.035em; margin: .8rem 0 .7rem; text-wrap: balance; }
h2 { font-size: 1.22rem; font-weight: 900; letter-spacing: -.02em; margin: 3rem 0 .6rem; padding-top: 1.4rem; border-top: 1.5px solid var(--ink); }
h3 { font-size: 1rem; margin: 1.8rem 0 .4rem; }
p { margin: 0 0 1rem; color: var(--ink-2); font-size: .95rem; }
.lead { color: var(--ink-2); font-size: .97rem; }
.muted { color: var(--ink-3); font-size: .88rem; }
strong { color: var(--ink); }

.panel { background: var(--surface); border: 1.5px solid var(--ink); padding: 1.2rem 1.4rem; margin: 1.2rem 0; }
.panel h3 { margin-top: 0; }
.panel p:last-child, .panel ul:last-child { margin-bottom: 0; }
.box { background: var(--surface); border: 1px solid var(--rule); padding: 1.2rem 1.4rem; margin: 1.2rem 0; }
.box h3 { margin-top: 0; }
.box p:last-child { margin-bottom: 0; }

ul.plain { margin: 0 0 1rem; padding: 0; list-style: none; display: grid; gap: .5rem; }
ul.plain li { display: grid; grid-template-columns: auto 1fr; gap: .65rem; color: var(--ink-2); font-size: .93rem; }
ul.plain li::before { content: ""; width: 9px; height: 9px; margin-top: .58em; border: 1.5px solid var(--ink); background: var(--amber); }

.tbl-wrap { border: 1.5px solid var(--ink); background: var(--surface); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 520px; }
th, td { text-align: left; padding: .75rem 1rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-weight: 500; font-size: .68rem; letter-spacing: .1em; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.yes { color: var(--signal); font-weight: 700; }
td.no { color: var(--ink-3); }

pre.sample {
  background: var(--surface); border: 1px solid var(--rule); padding: 1rem 1.1rem;
  overflow-x: auto; font-size: .84rem; line-height: 1.85; color: var(--ink-2); margin: .8rem 0 1rem;
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
details { border-bottom: 1px solid var(--rule); padding: .95rem 0; }
summary { cursor: pointer; font-size: .95rem; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: "IBM Plex Mono", monospace; color: var(--signal); font-weight: 600; flex: none; }
details[open] summary::after { content: "−"; }
details p { margin: .6rem 0 0; font-size: .89rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: .85rem 1.7rem; font-weight: 700; font-size: .94rem; text-decoration: none; border-radius: 2px; min-height: 48px; border: none; cursor: pointer; font-family: inherit; }
.btn-solid { background: var(--ink); color: #f7f9fc; }
.btn-line { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.cta-row { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 2rem; }

footer { margin-top: 3.4rem; border-top: 1.5px solid var(--ink); padding: 2rem 0 3rem; background: var(--surface); }
footer p, footer a { color: var(--ink-3); font-size: .82rem; }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }

/* ご意見・不具合の報告 */
main { max-width: 640px; margin: 0 auto; padding: 3rem 1.4rem 4rem; }
.badge { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .2em; color: var(--amber-ink); border-top: 2px solid var(--ink); padding-top: .5rem; display: inline-block; }
h1 { margin: .8rem 0 .6rem; }
.card { background: var(--surface); border: 1.5px solid var(--ink); padding: 1.5rem 1.5rem; margin-top: 1.6rem; }
.card.hidden { display: none; }
form label { display: block; font-family: "IBM Plex Mono", monospace; font-size: .66rem; letter-spacing: .16em; color: var(--ink-3); margin: 1.1rem 0 .5rem; }
form label:first-child { margin-top: 0; }
.kinds { display: flex; flex-wrap: wrap; gap: .5rem; }
.kinds input { position: absolute; opacity: 0; width: 0; height: 0; }
.kinds label { margin: 0; padding: .6rem 1.1rem; border: 1.5px solid var(--rule); color: var(--ink-2); cursor: pointer; font-family: inherit; font-size: .88rem; letter-spacing: 0; min-height: 44px; display: inline-flex; align-items: center; border-radius: 2px; }
.kinds input:checked + label { border-color: var(--ink); background: var(--ink); color: #f7f9fc; font-weight: 700; }
.kinds input:focus-visible + label { outline: 2px solid var(--signal); outline-offset: 2px; }
textarea {
  width: 100%; min-height: 9rem; padding: .8rem .9rem; border: 1.5px solid var(--rule);
  background: var(--paper); color: var(--ink); font-family: inherit; font-size: .93rem; line-height: 1.8; border-radius: 2px; resize: vertical;
}
textarea:focus { outline: none; border-color: var(--ink); }
.counter { font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--ink-3); text-align: right; margin-top: .35rem; }
button[type="submit"], #againBtn {
  width: 100%; margin-top: 1.2rem; padding: .9rem 1.6rem; min-height: 48px;
  background: var(--ink); color: #f7f9fc; border: none; border-radius: 2px;
  font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer;
}
button[type="submit"]:disabled { opacity: .45; cursor: default; }
.status { margin-top: .9rem; font-size: .87rem; color: var(--ink-3); min-height: 1.4em; }
.done { text-align: center; padding: 1rem 0; }
.done .mark { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .2em; color: var(--signal); }
.foot { margin-top: 2rem; font-size: .85rem; }
.foot a { color: var(--ink-3); text-decoration: none; }
.foot a:hover { color: var(--ink); }
</style>
</head>
<body>
  <main>
    <span class="badge">ご意見・不具合の報告</span>
    <h1>気づいたことを教えてください</h1>
    <p class="lead">いただいた内容はAIが自動で分類・優先順位付けし、次の開発計画に反映されます。</p>

    <div class="card" id="formCard">
      <form id="fbForm">
        <label>種別</label>
        <div class="kinds">
          <input type="radio" name="kind" id="k-bug" value="bug">
          <label for="k-bug">不具合</label>
          <input type="radio" name="kind" id="k-req" value="request" checked>
          <label for="k-req">要望</label>
          <input type="radio" name="kind" id="k-other" value="other">
          <label for="k-other">その他</label>
        </div>

        <label for="body">内容</label>
        <textarea id="body" maxlength="1000" placeholder="例: 号令を出したあとに時刻を変更したいです。&#10;例: 集結先ごとに別々のカウントダウンを出したいです。"></textarea>
        <div class="counter"><span id="count">0</span> / 1000</div>

        <button type="submit" id="submitBtn">送信する</button>
      </form>
      <div class="status" id="status"></div>
    </div>

    <div class="card hidden" id="doneCard">
      <div class="done">
        <div class="mark">RECEIVED</div>
        <h2 style="margin:0 0 .5rem;font-size:1.15rem;">ありがとうございました</h2>
        <p>いただいた内容は記録されました。<br>AIが他の声とあわせて分類し、開発の優先順位に反映します。</p>
        <button type="button" id="againBtn" style="max-width:240px;margin:1.2rem auto 0;">続けて報告する</button>
      </div>
    </div>

    <div class="foot"><a href="/">← 製品ページへ戻る</a></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';

    const bodyEl = document.getElementById('body');
    const countEl = document.getElementById('count');
    bodyEl.addEventListener('input', () => { countEl.textContent = bodyEl.value.length; });

    document.getElementById('fbForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('submitBtn');
      const kind = document.querySelector('input[name="kind"]:checked').value;
      const text = bodyEl.value.trim();

      if (!text) {
        statusEl.className = 'status err';
        statusEl.textContent = '内容を入力してください。';
        return;
      }

      btn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = '送信中…';

      try {
        const res = await fetch('/api/feedback-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kind, body: text, room }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '不明なエラー');

        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('doneCard').classList.remove('hidden');
      } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = 'エラー: ' + err.message;
        btn.disabled = false;
      }
    });

    document.getElementById('againBtn').addEventListener('click', () => {
      bodyEl.value = '';
      countEl.textContent = '0';
      document.getElementById('status').textContent = '';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('doneCard').classList.add('hidden');
      document.getElementById('formCard').classList.remove('hidden');
    });
  </script>
</body>
</html>
