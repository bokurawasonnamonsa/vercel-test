<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指揮官コンソール</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f1f5f9; padding: 2.5rem 1.5rem;
  }
  main { max-width: 560px; margin: 0 auto; }
  .badge {
    display: inline-block; padding: 0.35rem 0.9rem; background: #22c55e22; color: #4ade80;
    border: 1px solid #22c55e44; border-radius: 999px; font-size: 0.8rem; margin-bottom: 1rem;
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  p.lead { color: #94a3b8; margin-bottom: 2rem; }
  .card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;
  }
  .card h2 { margin: 0 0 1rem; font-size: 1.05rem; color: #cbd5e1; }
  .room-code { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.15em; color: #4ade80; }
  .share-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .share-row input {
    flex: 1; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: #0f172a; color: #f1f5f9; font-size: 0.85rem;
  }
  .share-row button, form button {
    padding: 0.6rem 1rem; border: none; border-radius: 8px; background: #334155; color: #f1f5f9;
    font-weight: 600; cursor: pointer; font-size: 0.85rem;
  }
  .share-row button:hover { background: #475569; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 0.9rem 0 0.35rem; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: #0f172a; color: #f1f5f9; font-size: 1rem;
  }
  .go-btn {
    margin-top: 1.5rem; width: 100%; padding: 1rem; border: none; border-radius: 10px;
    background: #22c55e; color: #05210f; font-weight: 800; font-size: 1.1rem; cursor: pointer;
  }
  .go-btn:hover { background: #4ade80; }
  .status { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; min-height: 1.4em; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
</style>
</head>
<body>
  <main>
    <span class="badge">指揮官コンソール（デモ）</span>
    <h1>号令を送信</h1>
    <p class="lead">ここで到着目標を設定すると、プレーヤー画面を開いている全員に自動で反映されます。</p>

    <div class="card">
      <h2>ルームコード</h2>
      <div class="room-code" id="roomCode">----</div>
      <label>プレーヤーに共有するURL</label>
      <div class="share-row">
        <input type="text" id="playerUrl" readonly>
        <button id="copyBtn" type="button">コピー</button>
      </div>
    </div>

    <div class="card">
      <h2>号令の内容</h2>
      <form id="commandForm">
        <label for="label">目的ラベル（例: 本丸集結）</label>
        <input type="text" id="label" placeholder="本丸集結" maxlength="60">

        <label for="seconds">何秒後に全員を到着させるか</label>
        <input type="number" id="seconds" min="5" max="3600" value="60">

        <button class="go-btn" type="submit">🚀 号令を送る</button>
      </form>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';
    document.getElementById('roomCode').textContent = room || '（不明）';
    const playerUrl = `${location.origin}/player-view.html?room=${encodeURIComponent(room)}`;
    document.getElementById('playerUrl').value = playerUrl;

    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(playerUrl);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });

    document.getElementById('commandForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const label = document.getElementById('label').value;
      const seconds = Number(document.getElementById('seconds').value);
      statusEl.className = 'status';
      statusEl.textContent = '送信中…';
      try {
        const res = await fetch('/api/room-set-target', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room, label, secondsFromNow: seconds }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '不明なエラー');
        statusEl.className = 'status ok';
        statusEl.textContent = `送信しました（${new Date().toLocaleTimeString('ja-JP')}）。プレーヤー画面に反映されます。`;
      } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = 'エラー: ' + err.message;
      }
    });
  </script>
</body>
</html>
