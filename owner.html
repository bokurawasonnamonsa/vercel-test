<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>運営ダッシュボード｜CommandClock</title>
<link rel="icon" type="image/png" href="/assets/icon-gold.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #08080c; --panel: rgba(255,255,255,0.04); --line: rgba(255,255,255,0.10);
    --text: #f4f2ee; --muted: #9a9488; --dim: #6b665d;
    --gold: #e9a93c; --green: #4ade80; --amber: #fcd9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 2.2rem 1.4rem 4rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.86rem; margin: 0.2rem 0 0; }
  .who { display: flex; align-items: center; gap: 0.6rem; font-size: 0.84rem; color: var(--muted); }
  button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.4rem 0.9rem; font-size: 0.82rem; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--gold); color: var(--gold); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.9rem; margin-bottom: 1.8rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.2rem; }
  .card .k { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--dim); }
  .card .v { font-size: 1.8rem; font-weight: 800; margin-top: 0.15rem; letter-spacing: -0.02em; }
  .card .v.money { color: var(--gold); }
  .card .v.ok { color: var(--green); }
  .tbl-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 780px; }
  th, td { text-align: left; padding: 0.75rem 0.95rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.08em; }
  tr:last-child td { border-bottom: none; }
  td.money { color: var(--gold); font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  .tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.68rem; border: 1px solid var(--line); }
  .tag.live { color: var(--green); border-color: rgba(74,222,128,0.35); }
  .tag.test { color: var(--amber); border-color: rgba(252,217,160,0.35); }
  .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
  .msg { margin-top: 1rem; font-size: 0.86rem; color: var(--muted); min-height: 1.4em; }
  .msg.err { color: #f0a0a0; }
  .gate { max-width: 460px; margin: 6rem auto; text-align: center; }
  .gate p { color: var(--muted); font-size: 0.9rem; }
  #gbtn { display: flex; justify-content: center; margin-top: 1.5rem; }
  .hidden { display: none !important; }
  .foot { margin-top: 2rem; font-size: 0.78rem; color: var(--dim); }
  .foot a { color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <!-- ログイン前 -->
  <div id="gate" class="gate">
    <h1>運営ダッシュボード</h1>
    <p>この画面は運営者のみが閲覧できます。<br>Googleアカウントでログインしてください。</p>
    <div id="gbtn"></div>
    <div id="gateMsg" class="msg"></div>
  </div>

  <!-- ログイン後 -->
  <div id="app" class="hidden">
    <header>
      <div>
        <h1>運営ダッシュボード</h1>
        <p class="sub">発行済みルームと、誰が・何を・いくら払ったかの控え</p>
      </div>
      <div class="who">
        <span id="whoami"></span>
        <button id="reloadBtn">再読み込み</button>
        <button id="logoutBtn">ログアウト</button>
      </div>
    </header>

    <div class="cards">
      <div class="card"><div class="k">本番決済の累計</div><div class="v money" id="cTotal">—</div></div>
      <div class="card"><div class="k">発行済みルーム</div><div class="v" id="cRooms">—</div></div>
      <div class="card"><div class="k">いま接続中</div><div class="v ok" id="cOnline">—</div></div>
      <div class="card"><div class="k">月額の合計</div><div class="v money" id="cMrr">—</div></div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>発行日時</th><th>お客様</th><th>プラン</th><th>金額</th>
            <th>種別</th><th>接続</th><th>ルームID</th><th>決済ID</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">まだ発行されたルームはありません。</div>
    </div>

    <div id="msg" class="msg"></div>

    <p class="foot">
      お金の記録の正本は <a href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener">Stripe</a> です。
      この画面はその控えを、発行したルームと結びつけて表示しています。<br>
      商品サーバー: <span id="appUrl" class="mono"></span>
    </p>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // 通貨ごとに書式を変える。ドル建ては最小単位がセント、円は円そのもの。
  function money(amount, currency) {
    if (typeof amount !== 'number') return '—';
    const c = String(currency || 'usd').toLowerCase();
    if (c === 'jpy') return '¥' + amount.toLocaleString('ja-JP');
    return '$' + (amount / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // 通貨が混ざっていても足し合わせない。通貨ごとに出す。
  function sumByCurrency(items, pick) {
    const acc = {};
    items.forEach((i) => {
      const v = pick(i);
      if (typeof v !== 'number') return;
      const c = String(i.currency || 'usd').toLowerCase();
      acc[c] = (acc[c] || 0) + v;
    });
    const keys = Object.keys(acc);
    if (!keys.length) return money(0, 'usd');
    return keys.map((c) => money(acc[c], c)).join(' + ');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  async function loadRooms() {
    $('msg').className = 'msg';
    $('msg').textContent = '読み込み中…';
    try {
      const res = await fetch('/api/owner-rooms');
      const data = await res.json();
      if (!res.ok) {
        let m = data.error || '取得に失敗しました';
        if (data.signedInAs) m += `（ログイン中: ${data.signedInAs}）`;
        if (data.hint) m += ` — ${data.hint}`;
        throw new Error(m);
      }

      const items = data.items || [];
      const live = items.filter((i) => i.livemode);
      const online = items.reduce((s, i) => s + (i.online || 0), 0);

      $('cTotal').textContent = sumByCurrency(live, (i) => i.amount);
      $('cRooms').textContent = items.length;
      $('cOnline').textContent = online + ' 名';
      $('cMrr').textContent = sumByCurrency(
        live.filter((i) => i.mode === 'subscription'),
        (i) => i.amount
      );
      $('appUrl').textContent = data.appUrl || '';

      const rows = $('rows');
      rows.innerHTML = '';
      items.forEach((i) => {
        const tr = document.createElement('tr');
        const tag = i.livemode
          ? '<span class="tag live">本番</span>'
          : '<span class="tag test">テスト</span>';
        tr.innerHTML = `
          <td>${fmtDate(i.issued_at)}</td>
          <td>${i.email || '<span style="color:#6b665d">—</span>'}</td>
          <td>${i.plan_label || i.item_name || i.name || '—'}</td>
          <td class="money">${money(i.amount, i.currency)}${i.mode === 'subscription' ? ' <span style="color:#6b665d;font-weight:400">/月</span>' : ''}</td>
          <td>${tag}</td>
          <td>${i.online ? i.online + ' 名' : '<span style="color:#6b665d">—</span>'}</td>
          <td class="mono">${(i.room_id || '').slice(0, 12)}…</td>
          <td class="mono" style="color:#6b665d">${(i.issued_for || '').slice(0, 18) || '—'}</td>`;
        rows.appendChild(tr);
      });

      $('empty').classList.toggle('hidden', items.length > 0);
      $('msg').textContent = `最終更新 ${new Date().toLocaleTimeString('ja-JP')}`;
    } catch (err) {
      $('msg').className = 'msg err';
      $('msg').textContent = 'エラー: ' + err.message;
    }
  }

  function showApp(user) {
    $('gate').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('whoami').textContent = user && user.email ? user.email : '';
    loadRooms();
  }

  function mountSignIn(clientId) {
    if (!clientId) {
      $('gateMsg').className = 'msg err';
      $('gateMsg').textContent = 'GOOGLE_CLIENT_ID が未設定のため、ログインを利用できません。';
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.onload = () => {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: async (response) => {
          $('gateMsg').className = 'msg';
          $('gateMsg').textContent = 'ログイン中…';
          try {
            const res = await fetch('/api/auth-google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: response.credential }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'ログインに失敗しました');
            showApp(data.user);
          } catch (err) {
            $('gateMsg').className = 'msg err';
            $('gateMsg').textContent = 'エラー: ' + err.message;
          }
        },
      });
      google.accounts.id.renderButton($('gbtn'), {
        theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ja',
      });
    };
    document.head.appendChild(script);
  }

  $('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth-logout', { method: 'POST' });
    location.reload();
  });
  $('reloadBtn').addEventListener('click', loadRooms);

  (async () => {
    try {
      const res = await fetch('/api/auth-me');
      const data = await res.json();
      if (data.signedIn) showApp(data.user);
      else mountSignIn(data.googleClientId);
    } catch (err) {
      $('gateMsg').className = 'msg err';
      $('gateMsg').textContent = 'エラー: ' + err.message;
    }
  })();
</script>
</body>
</html>
