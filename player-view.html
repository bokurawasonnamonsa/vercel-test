<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プレーヤー画面（オーバーレイ）</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #05070d url('/assets/hero-bg.png') center/cover no-repeat;
    color: #f1f5f9;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .backdrop {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(5,7,13,0.75), rgba(5,7,13,0.9));
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 380px; }
  .overlay-card {
    background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 1.75rem; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
  }
  .badge {
    display: inline-block; padding: 0.3rem 0.8rem; background: #22c55e22; color: #4ade80;
    border: 1px solid #22c55e44; border-radius: 999px; font-size: 0.75rem; margin-bottom: 0.75rem;
  }
  .label { font-size: 1rem; color: #cbd5e1; margin-bottom: 0.25rem; }
  .sublabel { font-size: 0.8rem; color: #64748b; margin-bottom: 1.25rem; }
  .timer-row { text-align: center; padding: 1rem 0; border-top: 1px solid rgba(255,255,255,0.1); }
  .timer-row:first-of-type { border-top: none; padding-top: 0; }
  .timer-title { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.35rem; }
  .timer-value { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer-value.mine { color: #4ade80; }
  .timer-value.arrival { color: #f1f5f9; font-size: 1.8rem; }
  .go { color: #4ade80; }
  .done { color: #64748b; }

  .setup-card {
    background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 1.75rem;
  }
  .setup-card label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; }
  .setup-card input {
    width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: #0f172a; color: #f1f5f9; font-size: 1rem; margin-bottom: 1rem;
  }
  .setup-card button {
    width: 100%; padding: 0.85rem; border: none; border-radius: 10px; background: #22c55e;
    color: #05210f; font-weight: 800; font-size: 1rem; cursor: pointer;
  }
  .waiting { text-align: center; color: #94a3b8; padding: 1.5rem 0; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <main>
    <div class="setup-card" id="setupCard">
      <span class="badge">初回のみ</span>
      <label for="travelTime">自分の移動時間（秒）</label>
      <input type="number" id="travelTime" min="0" max="600" value="0" placeholder="例: 45">
      <button id="saveTravelBtn" type="button">この端末で保存して開始</button>
    </div>

    <div class="overlay-card hidden" id="overlayCard">
      <span class="badge">オーバーレイ表示（デモ）</span>
      <div class="label" id="labelText">号令待ち</div>
      <div class="sublabel">ルーム: <span id="roomCode"></span> ／ 自分の移動時間: <span id="travelDisplay">0</span>秒</div>

      <div id="waitingBlock" class="waiting">まだ号令が送信されていません…</div>

      <div id="timerBlock" class="hidden">
        <div class="timer-row">
          <div class="timer-title">あなたのスタートまで</div>
          <div class="timer-value mine" id="myTimer">--:--</div>
        </div>
        <div class="timer-row">
          <div class="timer-title">全体の到着目標まで</div>
          <div class="timer-value arrival" id="arrivalTimer">--:--</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';
    document.getElementById('roomCode').textContent = room || '不明';
    const storageKey = `travelTime:${room}`;

    function formatMMSS(totalSeconds) {
      const sign = totalSeconds < 0 ? '-' : '';
      const abs = Math.abs(Math.round(totalSeconds));
      const m = Math.floor(abs / 60).toString().padStart(2, '0');
      const s = (abs % 60).toString().padStart(2, '0');
      return `${sign}${m}:${s}`;
    }

    function showOverlay(travelSeconds) {
      document.getElementById('setupCard').classList.add('hidden');
      document.getElementById('overlayCard').classList.remove('hidden');
      document.getElementById('travelDisplay').textContent = travelSeconds;
      startPolling(travelSeconds);
    }

    document.getElementById('saveTravelBtn').addEventListener('click', () => {
      const val = Number(document.getElementById('travelTime').value) || 0;
      localStorage.setItem(storageKey, String(val));
      showOverlay(val);
    });

    const saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      showOverlay(Number(saved));
    }

    let latestState = null;

    async function pollState() {
      try {
        const res = await fetch(`/api/room-state?room=${encodeURIComponent(room)}`);
        if (res.ok) {
          latestState = await res.json();
        }
      } catch (err) {
        // network hiccup; keep last known state
      }
    }

    function tick(travelSeconds) {
      if (!latestState || !latestState.targetEpochMs) {
        document.getElementById('waitingBlock').classList.remove('hidden');
        document.getElementById('timerBlock').classList.add('hidden');
        return;
      }
      document.getElementById('waitingBlock').classList.add('hidden');
      document.getElementById('timerBlock').classList.remove('hidden');
      document.getElementById('labelText').textContent = latestState.label || '号令';

      const now = Date.now();
      const arrivalRemainMs = latestState.targetEpochMs - now;
      const myStartRemainMs = latestState.targetEpochMs - travelSeconds * 1000 - now;

      const myEl = document.getElementById('myTimer');
      const arrivalEl = document.getElementById('arrivalTimer');

      if (myStartRemainMs <= 0) {
        myEl.textContent = 'スタート！';
        myEl.className = 'timer-value mine go';
      } else {
        myEl.textContent = formatMMSS(myStartRemainMs / 1000);
        myEl.className = 'timer-value mine';
      }

      if (arrivalRemainMs <= 0) {
        arrivalEl.textContent = '到着！';
        arrivalEl.className = 'timer-value arrival go';
      } else {
        arrivalEl.textContent = formatMMSS(arrivalRemainMs / 1000);
        arrivalEl.className = 'timer-value arrival';
      }
    }

    function startPolling(travelSeconds) {
      pollState();
      setInterval(pollState, 1000);
      setInterval(() => tick(travelSeconds), 250);
    }
  </script>
</body>
</html>
